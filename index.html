<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Measuring App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16283b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quantities iPad">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy:#16283b;
    --navy-2:#1f3a54;
    --paper:#eef1ea;
    --paper-2:#e2e6dc;
    --line:#c7cdbf;
    --orange:#d6602a;
    --orange-2:#b94f20;
    --ink:#1b2621;
    --ink-soft:#5c6a63;
    --white:#fffdf9;
    --good:#3d6b4c;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); font-family:var(--sans); color:var(--ink); height:100%;}
  body{ -webkit-user-select:none; user-select:none; overscroll-behavior-y:none; }
  input{ -webkit-user-select:text; user-select:text; }

  /* ---- Top bar ---- */
  .topbar{
    background:var(--navy); color:var(--white);
    padding:14px 18px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    border-bottom:4px solid var(--orange);
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .company{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#b9c6d3; font-weight:600;}
  .brand h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.01em;}
  .walknum{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .walknum label{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#b9c6d3;}
  .walknum input{
    width:110px; text-align:center; font-family:var(--mono); font-size:18px; font-weight:700;
    background:var(--navy-2); border:1px solid #33506b; color:var(--white); border-radius:8px; padding:7px 6px;
  }

  /* ---- Job info strip ---- */
  .jobinfo{
    background:var(--white); border-bottom:1px solid var(--line);
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:0;
  }
  .jobinfo .field{
    padding:8px 14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px;
  }
  .jobinfo .field:nth-child(3n){border-right:none;}
  .jobinfo label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-weight:600;}
  .jobinfo input{
    border:none; background:transparent; font-size:15px; font-family:var(--sans); color:var(--ink);
    padding:2px 0; border-bottom:1px solid transparent;
  }
  .jobinfo input:focus{outline:none; border-bottom:1px solid var(--orange);}

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex; gap:8px; padding:10px 14px; background:var(--paper-2); border-bottom:1px solid var(--line);
    align-items:center; flex-wrap:wrap;
  }
  .btn{
    border:none; border-radius:9px; padding:10px 15px; font-size:14px; font-weight:600; font-family:var(--sans);
    display:flex; align-items:center; gap:6px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{background:var(--navy); color:var(--white);}
  .btn-ghost{background:var(--white); color:var(--navy); border:1px solid var(--line);}
  .btn-save{background:var(--good); color:var(--white); margin-left:auto;}
  .btn-export{background:var(--orange); color:var(--white);}
  .btn svg{width:16px; height:16px;}
  .rowcount{font-size:12px; color:var(--ink-soft); font-family:var(--mono); margin-left:4px;}

  /* ---- Table area ---- */
  .tablewrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
  table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  colgroup col.addr{width:180px;}
  colgroup col.num{width:104px;}
  colgroup col.split{width:112px;}
  colgroup col.addcol{width:210px;}

  thead th{
    position:sticky; top:0; z-index:3; background:var(--navy); color:var(--white);
    padding:8px 6px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    border-right:1px solid #2c4661; text-align:center; vertical-align:bottom;
  }
  thead tr.sub th{
    top:38px; font-size:10px; font-weight:500; color:#c3d0da; text-transform:none; letter-spacing:0;
    padding:2px 6px 8px; font-family:var(--mono);
  }
  thead th.addr-col{ position:sticky; left:0; z-index:4; text-align:left; padding-left:12px; }
  thead tr.sub th.addr-col{ background:var(--navy); }

  tbody td{
    border:1px solid var(--line); padding:0; background:var(--white); height:52px;
  }
  tbody tr:nth-child(even) td{ background:#f7f8f3; }
  tbody td.addr-col{
    position:sticky; left:0; z-index:2; background:var(--white) !important; border-right:2px solid var(--navy);
  }

  .cell-input{
    width:100%; height:100%; border:none; background:transparent; text-align:center;
    font-family:var(--mono); font-size:15px; color:var(--ink); padding:0 4px;
  }
  .cell-input:focus{ outline:2px solid var(--orange); outline-offset:-2px; background:#fff8f0; }
  input.addr-input{ text-align:left; font-family:var(--sans); font-size:15px; padding:0 12px; }

  /* split cell */
  .splitcell{ display:flex; flex-direction:column; height:100%; position:relative; }
  .splitcell .pair{ display:flex; flex:1; }
  .splitcell .pair input{ width:50%; border:none; background:transparent; text-align:center; font-family:var(--mono); font-size:13px; padding:0 2px;}
  .splitcell .pair input:first-child{ border-right:1px dashed var(--line); }
  .splitcell .pair input:focus{ outline:2px solid var(--orange); outline-offset:-2px; background:#fff8f0;}
  .splitcell .product{
    font-size:10.5px; text-align:center; font-family:var(--mono); color:var(--good); font-weight:700;
    background:#eef5ee; border-top:1px solid var(--line); padding:1px 0; letter-spacing:.02em;
  }
  .splitcell .product.empty{ color:#b7bdb3; background:transparent; font-weight:400; }

  /* delete row btn */
  .rowdel{
    width:210px; text-align:center; background:transparent !important; border:none !important; padding:4px !important;
  }
  .row-actions{display:flex; gap:4px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .quick-toggle{
    border:1px solid #a9b7ae; background:#fff; color:var(--ink); border-radius:7px;
    padding:5px 7px; font-size:10px; font-weight:700; white-space:nowrap;
  }
  .quick-toggle.active{background:var(--good); color:#fff; border-color:var(--good);}
  .rowdel .delete-row{
    width:26px; height:26px; border-radius:50%; border:none; background:#e9e2df; color:#a3453a;
    font-size:15px; font-weight:700; line-height:1;
  }

  tfoot td{
    position:sticky; bottom:0; background:var(--navy); color:var(--white);
    font-family:var(--mono); font-weight:700; font-size:13px; text-align:center; padding:9px 4px;
    border-right:1px solid #2c4661; z-index:2;
  }
  tfoot td.addr-col{ position:sticky; left:0; bottom:0; z-index:5; text-align:right; padding-right:12px; background:var(--navy) !important; font-family:var(--sans); }

  th.addcol-th, td.addcol-cell{ border-left:2px dashed #9fb0a5; }

  .addcolbtn{
    width:40px; height:40px; border-radius:10px; border:1.5px dashed var(--ink-soft); background:transparent;
    color:var(--ink-soft); font-size:20px; display:flex; align-items:center; justify-content:center; margin:6px auto;
  }


  /* ---- Signatures ---- */
  .signatures{
    background:var(--white); border-bottom:1px solid var(--line);
    display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 14px;
  }
  .signature-card{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fafbf7;}
  .signature-card h2{margin:0; padding:8px 10px; background:var(--paper-2); color:var(--navy); font-size:12px; text-transform:uppercase; letter-spacing:.08em;}
  .signature-meta{display:grid; grid-template-columns:1fr 130px; gap:8px; padding:8px 10px 0;}
  .signature-meta label{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; display:block;}
  .signature-meta input{width:100%; border:none; border-bottom:1px solid var(--line); background:transparent; padding:5px 2px; font-size:14px;}
  .signature-pad-wrap{padding:8px 10px 6px;}
  .signature-pad{width:100%; height:105px; display:block; background:white; border:1px solid var(--line); border-radius:8px; touch-action:none;}
  .signature-actions{display:flex; justify-content:space-between; align-items:center; padding:0 10px 9px; font-size:10px; color:var(--ink-soft);}
  .clear-signature{border:1px solid var(--line); background:white; border-radius:7px; padding:6px 10px; color:#a3453a; font-weight:600;}
  @media(max-width:760px){.signatures{grid-template-columns:1fr;}.signature-meta{grid-template-columns:1fr 120px;}}

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(20,30,25,.45); display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--white); border-radius:14px; padding:20px; width:min(90vw, 360px); box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .modal h3{ margin:0 0 14px; font-size:16px; color:var(--navy); }
  .modal label{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .modal input[type=text]{ width:100%; padding:10px; margin:6px 0 14px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .modal .types{ display:flex; gap:8px; margin-bottom:16px; }
  .modal .types button{ flex:1; padding:9px 4px; border-radius:8px; border:1.5px solid var(--line); background:var(--white); font-size:12px; font-weight:600; color:var(--ink-soft); }
  .modal .types button.active{ border-color:var(--orange); color:var(--orange); background:#fdf1ea; }
  .modal .actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal .actions button{ padding:10px 16px; border-radius:8px; border:none; font-weight:600; font-size:14px; }
  .modal .cancel{ background:var(--paper-2); color:var(--ink-soft); }
  .modal .confirm{ background:var(--navy); color:white; }
  .startup-modal{width:min(92vw,460px); text-align:center;}
  .startup-modal p{color:var(--ink-soft); margin:0 0 18px; line-height:1.45;}
  .startup-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .startup-actions button{padding:14px 10px; border-radius:10px; border:none; font-size:15px; font-weight:700;}
  .startup-new{background:var(--white); color:var(--navy); border:1px solid var(--line)!important;}
  .startup-previous{background:var(--navy); color:white;}
  .startup-previous:disabled{opacity:.45;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:white; padding:10px 18px; border-radius:20px; font-size:13px;
    box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  ::placeholder{ color:#c2c8bc; }

  /* ---- iPad field-use trial optimizations ---- */
  button,input{touch-action:manipulation;}
  .toolbar{
    position:sticky; top:0; z-index:20;
    min-height:62px; padding:8px 12px;
    box-shadow:0 2px 8px rgba(22,40,59,.16);
  }
  .btn{min-height:46px; padding:11px 17px; font-size:15px; border-radius:11px;}
  .rowcount{font-size:13px;}
  .tablewrap{
    height:calc(100dvh - 228px);
    min-height:430px;
    border-bottom:3px solid var(--orange);
    overscroll-behavior:contain;
    background:var(--white);
  }
  colgroup col.addr{width:190px;}
  colgroup col.num{width:112px;}
  colgroup col.split{width:128px;}
  colgroup col.addcol{width:230px;}
  thead th{height:42px; padding:9px 7px 5px; font-size:12px;}
  thead tr.sub th{top:42px; height:32px; padding:3px 7px 8px; font-size:11px;}
  tbody td{height:64px;}
  .cell-input{font-size:18px; padding:0 7px;}
  input.addr-input{font-size:17px; padding:0 14px;}
  .splitcell .pair input{font-size:16px; min-height:40px;}
  .splitcell .product{font-size:12px; padding:3px 0;}
  .quick-toggle{min-height:32px; padding:6px 8px; font-size:11px;}
  .rowdel .delete-row{width:34px; height:34px; font-size:18px;}
  tfoot td{height:46px; font-size:15px; padding:10px 5px;}
  .signatures{padding:18px 14px 28px;}
  .signature-pad{height:150px;}
  .signature-card h2{padding:11px 12px; font-size:13px;}
  .signature-meta input{min-height:42px; font-size:16px;}
  .clear-signature{min-height:40px; padding:8px 14px; font-size:14px;}
  .modal{width:min(88vw,480px); padding:24px;}
  .modal input[type=text]{min-height:48px; font-size:17px;}
  .modal .actions button,.startup-actions button{min-height:50px; font-size:16px;}

  @media (orientation:landscape) and (min-width:768px){
    .topbar{padding:9px 16px 8px;}
    .brand .company{font-size:11px;}
    .brand h1{font-size:17px;}
    .walknum input{font-size:17px; padding:5px;}
    .jobinfo{grid-template-columns:repeat(6,1fr);}
    .jobinfo .field{padding:6px 10px; border-bottom:none;}
    .jobinfo .field:nth-child(3n){border-right:1px solid var(--line);}
    .jobinfo .field:last-child{border-right:none;}
    .jobinfo input{font-size:14px;}
    .toolbar{min-height:58px;}
    .tablewrap{height:calc(100dvh - 157px); min-height:410px;}
    colgroup col.addr{width:180px;}
    colgroup col.num{width:105px;}
    colgroup col.split{width:120px;}
    tbody td{height:60px;}
  }

  @media (orientation:portrait) and (min-width:768px){
    .jobinfo{grid-template-columns:repeat(3,1fr);}
    .tablewrap{height:calc(100dvh - 235px);}
  }

  @media (max-width:767px){
    .topbar{padding:10px 12px;}
    .brand h1{font-size:16px;}
    .jobinfo{grid-template-columns:repeat(2,1fr);}
    .jobinfo .field:nth-child(3n){border-right:1px solid var(--line);}
    .jobinfo .field:nth-child(2n){border-right:none;}
    .toolbar{top:0;}
    .btn{min-height:44px; padding:9px 12px; font-size:14px;}
    .btn-export{width:100%; justify-content:center; order:5;}
    .tablewrap{height:calc(100dvh - 315px); min-height:360px;}
  }

</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="company" id="companyName">Marmot Construction Ltd.</span>
    <h1>Confirmation of Maintenance Quantities <span style="font-size:10px;opacity:.75;white-space:nowrap">IPAD TRIAL</span></h1>
  </div>
  <div class="walknum">
    <label>Walk #</label>
    <input id="walkNum" inputmode="numeric" placeholder="—">
  </div>
</div>

<div class="jobinfo" id="jobinfo"></div>


<div class="toolbar">
  <button class="btn btn-primary" id="addRowBtn">＋ Add Row</button>
  <button class="btn btn-ghost" id="addColBtn">＋ Add Column</button>
  <span class="rowcount" id="rowCount"></span>
  <button class="btn btn-export" id="exportBtn">⇪ Export / Share Excel + PDF</button>
</div>

<div class="tablewrap">
  <table id="mainTable">
    <colgroup id="colgroup"></colgroup>
    <thead>
      <tr id="headRow1"></tr>
      <tr class="sub" id="headRow2"></tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot>
      <tr id="footRow"></tr>
    </tfoot>
  </table>
</div>

<div class="signatures">
  <section class="signature-card">
    <h2>Consultant Approval</h2>
    <div class="signature-meta">
      <div><label>Printed Name</label><input id="consultantName" type="text" autocomplete="name" placeholder="Consultant name"></div>
      <div><label>Date</label><input id="consultantDate" type="date"></div>
    </div>
    <div class="signature-pad-wrap"><canvas class="signature-pad" id="consultantSignature"></canvas></div>
    <div class="signature-actions"><span>Sign with finger or Apple Pencil</span><button class="clear-signature" data-clear-signature="consultant">Clear</button></div>
  </section>
  <section class="signature-card">
    <h2>Contractor Approval</h2>
    <div class="signature-meta">
      <div><label>Printed Name</label><input id="contractorName" type="text" autocomplete="name" placeholder="Contractor name"></div>
      <div><label>Date</label><input id="contractorDate" type="date"></div>
    </div>
    <div class="signature-pad-wrap"><canvas class="signature-pad" id="contractorSignature"></canvas></div>
    <div class="signature-actions"><span>Sign with finger or Apple Pencil</span><button class="clear-signature" data-clear-signature="contractor">Clear</button></div>
  </section>
</div>

<div class="overlay show" id="startupModal">
  <div class="modal startup-modal">
    <h3>Open Maintenance Sheet</h3>
    <p>Start a new blank document or continue the previous autosaved document.</p>
    <div class="startup-actions">
      <button class="startup-new" id="newDocumentBtn">New Blank</button>
      <button class="startup-previous" id="previousDocumentBtn">Open Previous</button>
    </div>
  </div>
</div>

<div class="overlay" id="colModal">
  <div class="modal">
    <h3>Add a column</h3>
    <label>Column name</label>
    <input type="text" id="newColName" placeholder="e.g. Notes, Guardrail">
    <label>Entry type</label>
    <div class="types" id="typeButtons">
      <button data-type="number" class="active">Number</button>
      <button data-type="split">Two ×</button>
      <button data-type="text">Text</button>
    </div>
    <div class="actions">
      <button class="cancel" id="colCancel">Cancel</button>
      <button class="confirm" id="colConfirm">Add Column</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Maintenance Quantities Field Sheet — app logic
   ============================================================ */

const STORAGE_KEY = 'maintenance-sheet-v1';

const BASE_COLUMNS = [
  { key:'address', label:'Address', sub:'', type:'text', addr:true },
  { key:'curb250', label:'Curb', sub:'250', type:'number' },
  { key:'curb500', label:'Curb', sub:'500', type:'number' },
  { key:'sw1', label:'Monolithic S/W', sub:'(1.1 / 1.2)', type:'number' },
  { key:'sw2', label:'Monolithic S/W', sub:'(1.5 / 1.61)', type:'number' },
  { key:'sw3', label:'Monolithic S/W', sub:'(2.0 / 2.1)', type:'number' },
  { key:'flag', label:'Flag', sub:'L × W', type:'split' },
  { key:'sw', label:'S/W', sub:'L × W', type:'split' },
  { key:'dwapron', label:'DW Apron', sub:'L × W', type:'split' },
  { key:'dwcomm', label:'DW Comm', sub:'L × W', type:'split' },
  { key:'swale', label:'Swale', sub:'', type:'number' },
  { key:'sawcut', label:'Sawcut', sub:'', type:'number' },
  { key:'rehab', label:'Rehab Slurry', sub:'', type:'number' },
  { key:'land', label:'Land', sub:'', type:'number' },
];

const JOB_FIELDS = [
  { key:'location', label:'Location' },
  { key:'phase', label:'Phase' },
  { key:'date', label:'Date' },
  { key:'owner', label:'Owner' },
  { key:'engineer', label:'Engineer' },
  { key:'jobnum', label:'Job #' },
];

let state = {
  job: {},
  walkNum: '',
  columns: JSON.parse(JSON.stringify(BASE_COLUMNS)),
  rows: [],
  nextRowId: 1,
  nextColId: 1,
  signatures: {
    consultant: { name:'', date:'', image:'' },
    contractor: { name:'', date:'', image:'' },
  },
};

function blankRow(){
  const row = { id: state.nextRowId++, fullSlurry:false, fullLandscape:false, lastAutoSawcut:'' };
  state.columns.forEach(c=>{
    row[c.key] = (c.type === 'split') ? { a:'', b:'' } : '';
  });
  return row;
}

/* ---------------- persistence ----------------
   This file runs standalone in Safari on the iPad (not inside the
   Claude artifact panel), so we use localStorage to autosave progress
   between sessions — e.g. if Safari is closed mid-walk. */
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* storage unavailable (e.g. private browsing) — data stays in memory for this session */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.columns && parsed.rows){
        state = parsed;
        if(!state.signatures){
          state.signatures = { consultant:{name:'',date:'',image:''}, contractor:{name:'',date:'',image:''} };
        }
        state.rows.forEach(r=>{
          if(typeof r.fullSlurry !== 'boolean') r.fullSlurry = false;
          if(typeof r.fullLandscape !== 'boolean') r.fullLandscape = false;
          if(r.lastAutoSawcut === undefined) r.lastAutoSawcut = '';
        });
        return true;
      }
    }
  }catch(e){ /* ignore */ }
  return false;
}

/* ---------------- rendering ---------------- */
function fmtNum(n){
  if(n === '' || n === null || n === undefined || isNaN(n)) return '';
  const rounded = Math.round(n*100)/100;
  return rounded.toString();
}

function computeColumnTotal(col){
  let sum = 0, any = false;
  state.rows.forEach(r=>{
    if(col.type === 'split'){
      const a = parseFloat(r[col.key]?.a);
      const b = parseFloat(r[col.key]?.b);
      if(!isNaN(a) && !isNaN(b)){ sum += a*b; any = true; }
    } else if(col.type === 'number'){
      const v = parseFloat(r[col.key]);
      if(!isNaN(v)){ sum += v; any = true; }
    }
  });
  return any ? sum : null;
}

function escapeAttr(s){

function renderTable(){

  const thAdd2 = document.createElement('th'); thAdd2.className='addcol-th'; headRow2.appendChild(thAdd2);

  // rows

      <button class="quick-toggle ${row.fullLandscape ? 'active' : ''}" data-quick="landscape" data-row="${row.id}">Full Landscape</button>
      <button class="delete-row" title="Delete row" data-del="${row.id}">×</button>
    </div>`;
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });

  // footer totals
  footRow.innerHTML = '';
  state.columns.forEach((col, i)=>{
    const td = document.createElement('td');
    if(col.addr){
      td.classList.add('addr-col');
      td.textContent = 'TOTALS';
    } else if(col.type === 'text'){
      td.textContent = '';
    } else {
      const t = computeColumnTotal(col);
      td.textContent = t === null ? '—' : fmtNum(t);
    }
    footRow.appendChild(td);
  });
  const tdFootAdd = document.createElement('td');
  footRow.appendChild(tdFootAdd);

  document.getElementById('rowCount').textContent = state.rows.length + ' row' + (state.rows.length===1?'':'s');

  attachCellEvents();

function buildCellInput(row, col){
  if(col.type === 'split'){
    const wrap = document.createElement('div');
    wrap.className = 'splitcell';
    const pair = document.createElement('div');
    pair.className = 'pair';
    const a = document.createElement('input');
    a.type='text'; a.inputMode='decimal'; a.placeholder='L';
    a.value = row[col.key].a;
    a.dataset.rowId = row.id; a.dataset.col = col.key; a.dataset.part = 'a';
    const b = document.createElement('input');
    b.type='text'; b.inputMode='decimal'; b.placeholder='W';
    b.value = row[col.key].b;
    b.dataset.rowId = row.id; b.dataset.col = col.key; b.dataset.part = 'b';
    pair.appendChild(a); pair.appendChild(b);
    const prod = document.createElement('div');
    const av = parseFloat(row[col.key].a), bv = parseFloat(row[col.key].b);
    const hasProduct = !isNaN(av) && !isNaN(bv);
    prod.className = 'product' + (hasProduct ? '' : ' empty');
    prod.textContent = hasProduct ? (fmtNum(av*bv) + ' m²') : 'm²';
    wrap.appendChild(pair); wrap.appendChild(prod);
    return wrap;
  } else {
    const input = document.createElement('input');
    input.className = 'cell-input' + (col.addr ? ' addr-input' : '');
    input.type = 'text';
    if(!col.addr) input.inputMode = 'decimal';
    input.value = row[col.key];
    input.dataset.rowId = row.id;
    input.dataset.col = col.key;
    input.placeholder = col.addr ? 'Tap to type address…' : '—';
    return input;
  }
}

function attachCellEvents(){
  document.querySelectorAll('#tbody input[data-part]').forEach(inp=>{
    inp.addEventListener('input', onSplitInput);
  });
  document.querySelectorAll('#tbody input:not([data-part])').forEach(inp=>{
    inp.addEventListener('input', onPlainInput);
  });
  document.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteRow(btn.dataset.del));
  });
  document.querySelectorAll('button[data-quick]').forEach(btn=>{
    btn.addEventListener('click', ()=>toggleQuickFill(btn.dataset.row, btn.dataset.quick));
  });
}

function sanitizeDecimal(v){
  // allow digits and a single decimal point
  let cleaned = v.replace(/[^0-9.]/g,'');
  const firstDot = cleaned.indexOf('.');
  if(firstDot !== -1){
    cleaned = cleaned.slice(0, firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g,'');
  }
  return cleaned;
}


function positiveNumber(v){
  const n = parseFloat(v);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function rowMeasurementLength(row){
  // Full slurry/landscape is based on the longest measured structure in the row,
  // then extended 0.6 m for working room.
  const lengths = [
    positiveNumber(row.curb250), positiveNumber(row.curb500),
    positiveNumber(row.sw1), positiveNumber(row.sw2), positiveNumber(row.sw3),
    positiveNumber(row.flag?.a), positiveNumber(row.sw?.a),
    positiveNumber(row.dwapron?.a), positiveNumber(row.dwcomm?.a),
    positiveNumber(row.swale)
  ];
  return Math.max(0, ...lengths);
}

function calculatedSawcut(row){
  let total = 0;
  if(positiveNumber(row.curb250)) total += 1.2;
  if(positiveNumber(row.curb500)) total += 1.8;
  if(positiveNumber(row.sw2)) total += 4;
  if(positiveNumber(row.sw3)) total += 5;
  const sidewalkWidth = positiveNumber(row.sw?.b);
  if(positiveNumber(row.sw?.a) && sidewalkWidth) total += 2 * sidewalkWidth;
  return total;
}

function applyRowAutofill(row, forceSawcut=false){
  const measuredLength = rowMeasurementLength(row);
  const fullValue = measuredLength > 0 ? fmtNum(measuredLength + 0.6) : '';
  if(row.fullSlurry) row.rehab = fullValue;
  if(row.fullLandscape) row.land = fullValue;

  const oldAuto = row.lastAutoSawcut ?? '';
  const current = row.sawcut ?? '';
  const canReplace = forceSawcut || current === '' || String(current) === String(oldAuto);
  if(canReplace){
    const sawcut = calculatedSawcut(row);
    row.sawcut = sawcut > 0 ? fmtNum(sawcut) : '';
    row.lastAutoSawcut = row.sawcut;
  }
}

function toggleQuickFill(rowId, type){
  const row = state.rows.find(r=>String(r.id)===String(rowId));
  if(!row) return;
  if(type === 'slurry') row.fullSlurry = !row.fullSlurry;
  if(type === 'landscape') row.fullLandscape = !row.fullLandscape;
  applyRowAutofill(row, false);
  renderTable();
  saveState();
}

function refreshRowInputs(row){
  const tr = document.querySelector(`tr[data-row-id="${row.id}"]`);
  if(!tr) return;
  ['sawcut','rehab','land'].forEach(key=>{
    const input = tr.querySelector(`input[data-col="${key}"]`);
    if(input) input.value = row[key] || '';
  });
  const slurryBtn = tr.querySelector('button[data-quick="slurry"]');
  const landBtn = tr.querySelector('button[data-quick="landscape"]');
  if(slurryBtn) slurryBtn.classList.toggle('active', !!row.fullSlurry);
  if(landBtn) landBtn.classList.toggle('active', !!row.fullLandscape);
}

function onPlainInput(e){
  const rowId = e.target.dataset.rowId;
  const colKey = e.target.dataset.col;
  const row = state.rows.find(r=>String(r.id)===String(rowId));
  if(!row) return;
  const col = state.columns.find(c=>c.key===colKey);
  let val = e.target.value;
  if(!col.addr){
    val = sanitizeDecimal(val);
    if(val !== e.target.value) e.target.value = val;
  }
  row[colKey] = val;
  if(colKey === 'rehab' && row.fullSlurry) row.fullSlurry = false;
  if(colKey === 'land' && row.fullLandscape) row.fullLandscape = false;
  if(colKey === 'sawcut') row.lastAutoSawcut = '';
  if(!['address','rehab','land','sawcut'].includes(colKey)) applyRowAutofill(row, false);
  refreshRowInputs(row);
  updateFooterOnly();
  saveState();
}

function onSplitInput(e){
  const rowId = e.target.dataset.rowId;
  const colKey = e.target.dataset.col;
  const part = e.target.dataset.part;
  const row = state.rows.find(r=>String(r.id)===String(rowId));
  if(!row) return;
  let val = sanitizeDecimal(e.target.value);
  if(val !== e.target.value) e.target.value = val;
  row[colKey][part] = val;

  // update the product display live without full re-render (preserves focus)
  const cell = e.target.closest('.splitcell');
  const prod = cell.querySelector('.product');
  const av = parseFloat(row[colKey].a), bv = parseFloat(row[colKey].b);
  const hasProduct = !isNaN(av) && !isNaN(bv);
  prod.className = 'product' + (hasProduct ? '' : ' empty');
  prod.textContent = hasProduct ? (fmtNum(av*bv) + ' m²') : 'm²';

  applyRowAutofill(row, false);
  refreshRowInputs(row);
  updateFooterOnly();
  saveState();
}

function updateFooterOnly(){
  const footRow = document.getElementById('footRow');
  const cells = footRow.children;
  state.columns.forEach((col, i)=>{
    if(col.addr || col.type === 'text') return;
    const t = computeColumnTotal(col);
    cells[i].textContent = t === null ? '—' : fmtNum(t);
  });
}

function deleteRow(rowId){
  if(!confirm('Delete this row?')) return;
  state.rows = state.rows.filter(r=>String(r.id) !== String(rowId));
  renderTable();
  saveState();
}

function addRow(){
  state.rows.push(blankRow());
  renderTable();
  saveState();
  // scroll new row into view
  const wrap = document.querySelector('.tablewrap');
  wrap.scrollTop = wrap.scrollHeight;
}

function addColumn(name, type){
  const key = 'custom_' + (state.nextColId++);
  state.columns.push({ key, label: name || 'New Column', sub: type==='split' ? 'L × W' : '', type });
  state.rows.forEach(r=>{
    r[key] = (type === 'split') ? { a:'', b:'' } : '';
  });
  renderTable();
  saveState();
}

function showToast(msg){

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 2200);

/* ---------------- export / save ---------------- */
function safeBaseName(){
  const walk = state.walkNum ? `-Walk-${state.walkNum}` : '';
  const location = (state.job.location || '').trim().replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'');
  return `Maintenance_Quantities${location ? '-' + location : ''}${walk}`;
}

function buildWorkbook(){
  const aoa = [];
  aoa.push(['Marmot Construction Ltd.']);
  aoa.push(['Confirmation of Maintenance Quantities']);
  aoa.push(['Walk #:', state.walkNum || '']);
  aoa.push([]);
  aoa.push(['Location:', state.job.location||'', '', 'Phase:', state.job.phase||'', '', 'Date:', state.job.date||'']);
  aoa.push(['Owner:', state.job.owner||'', '', 'Engineer:', state.job.engineer||'', '', 'Job #:', state.job.jobnum||'']);
  aoa.push([]);
  aoa.push(['Consultant Approval:', state.signatures?.consultant?.name||'', '', 'Date:', state.signatures?.consultant?.date||'', '', state.signatures?.consultant?.image ? 'Signed in app' : 'Not signed']);
  aoa.push(['Contractor Approval:', state.signatures?.contractor?.name||'', '', 'Date:', state.signatures?.contractor?.date||'', '', state.signatures?.contractor?.image ? 'Signed in app' : 'Not signed']);
  aoa.push([]);

  const headerLabels = state.columns.map(c=> c.type==='split' ? (c.label + ' (m²)') : c.label);
  const subLabels = state.columns.map(c=> c.sub && c.type!=='split' ? c.sub : '');
  aoa.push(headerLabels);
  if(subLabels.some(s=>s)) aoa.push(subLabels);

  state.rows.forEach(row=>{
    aoa.push(state.columns.map(col=>{
      if(col.type === 'split'){
        const a = parseFloat(row[col.key]?.a), b = parseFloat(row[col.key]?.b);
        return (!isNaN(a) && !isNaN(b)) ? Math.round(a*b*100)/100 : '';
      }
      if(col.type === 'number'){
        const v = parseFloat(row[col.key]);
        return isNaN(v) ? '' : v;
      }
      return row[col.key] || '';
    }));
  });

  aoa.push(state.columns.map(col=>{
    if(col.addr) return 'TOTALS';
    if(col.type === 'text') return '';
    const t = computeColumnTotal(col);
    return t === null ? '' : Math.round(t*100)/100;
  }));

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = state.columns.map(c => ({ wch: c.addr ? 26 : 14 }));
  ws['!merges'] = [
    { s:{r:0,c:0}, e:{r:0,c:state.columns.length-1} },
    { s:{r:1,c:0}, e:{r:1,c:state.columns.length-1} },
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Maintenance Quantities');
  return wb;
}

function buildExcelFile(baseName){
  const wbout = XLSX.write(buildWorkbook(), { bookType:'xlsx', type:'array' });
  return new File([wbout], baseName+'.xlsx', {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function pdfCellValue(row, col){
  if(col.type === 'split'){
    const a=parseFloat(row[col.key]?.a), b=parseFloat(row[col.key]?.b);
    return (!isNaN(a)&&!isNaN(b)) ? fmtNum(a*b) : '';
  }
  return row[col.key] || '';
}

function addSignatureToPdf(doc, role, x, y, width){
  const sig=state.signatures[role] || {};
  doc.setFontSize(8);
  doc.setTextColor(70);
  doc.text(role==='consultant' ? 'Consultant Approval' : 'Contractor Approval', x, y);
  doc.setDrawColor(160);
  doc.rect(x, y+3, width, 24);
  if(sig.image){
    try{ doc.addImage(sig.image, 'PNG', x+2, y+5, width-4, 15, undefined, 'FAST'); }catch(e){}
  }
  doc.setFontSize(7);
  doc.text(`Name: ${sig.name||''}`, x+2, y+23);
  doc.text(`Date: ${sig.date||''}`, x+width-35, y+23);
}

function buildPdfFile(baseName){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'letter'});
  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('Marmot Construction Ltd.', 10, 10);
  doc.setFontSize(12);
  doc.text('Confirmation of Maintenance Quantities', 10, 17);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.text(`Walk #: ${state.walkNum||''}`, 250, 10);
  doc.text(`Location: ${state.job.location||''}`,10,24);
  doc.text(`Phase: ${state.job.phase||''}`,95,24);
  doc.text(`Date: ${state.job.date||''}`,180,24);
  doc.text(`Owner: ${state.job.owner||''}`,10,29);
  doc.text(`Engineer: ${state.job.engineer||''}`,95,29);
  doc.text(`Job #: ${state.job.jobnum||''}`,180,29);

  const head=[state.columns.map(c=>c.sub ? `${c.label}\n${c.sub}` : c.label)];
  const body=state.rows.map(r=>state.columns.map(c=>pdfCellValue(r,c)));
  body.push(state.columns.map(c=>c.addr ? 'TOTALS' : (c.type==='text' ? '' : fmtNum(computeColumnTotal(c)))));

  doc.autoTable({
    startY:34,
    head,
    body,
    theme:'grid',
    styles:{fontSize:5.5, cellPadding:1.2, halign:'center', overflow:'linebreak'},
    headStyles:{fillColor:[22,40,59], textColor:255, fontStyle:'bold'},
    columnStyles:{0:{cellWidth:30,halign:'left'}},
    didParseCell(data){
      if(data.section==='body' && data.row.index===body.length-1){
        data.cell.styles.fillColor=[22,40,59]; data.cell.styles.textColor=255; data.cell.styles.fontStyle='bold';
      }
    },
    margin:{left:8,right:8}
  });

  let y=doc.lastAutoTable.finalY+7;
  if(y+33>doc.internal.pageSize.getHeight()){doc.addPage(); y=12;}
  const pageWidth=doc.internal.pageSize.getWidth();
  const box=(pageWidth-26)/2;
  addSignatureToPdf(doc,'consultant',8,y,box);
  addSignatureToPdf(doc,'contractor',18+box,y,box);

  return new File([doc.output('blob')], baseName+'.pdf', {type:'application/pdf'});
}

function cleanFileName(name){
  return String(name || '')
    .replace(/\.(xlsx|pdf)$/i, '')
    .replace(/[\\/:*?"<>|]+/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/[. ]+$/g, '');
}

function askForFileName(){
  const entered = window.prompt('Name the Excel and PDF files:', safeBaseName());
  if(entered === null) return null;
  const cleaned = cleanFileName(entered);
  if(!cleaned){
    alert('Please enter a file name.');
    return askForFileName();
  }
  return cleaned;
}

async function createExportFiles(baseName){
  return [buildExcelFile(baseName), buildPdfFile(baseName)];
}

function downloadFile(file){
  const url=URL.createObjectURL(file);
  const a=document.createElement('a'); a.href=url; a.download=file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

async function shareFiles(){
  const baseName = askForFileName();
  if(!baseName) return;
  const files=await createExportFiles(baseName);
  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({files, title:baseName, text:'Maintenance quantities Excel and PDF.'});
      showToast('Excel and PDF shared.');
      return;
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  files.forEach(downloadFile);
  showToast('Excel and PDF downloaded.');
}

/* ---------------- signatures ---------------- */
function ensureSignatureState(){
  if(!state.signatures) state.signatures = {};
  ['consultant','contractor'].forEach(role=>{
    if(!state.signatures[role]) state.signatures[role] = {name:'',date:'',image:''};
  });
}

function setupSignaturePad(role){
  const canvas = document.getElementById(role + 'Signature');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let last = null;
  let lastSignatureSave = 0;

  function resizeCanvas(){
    const saved = state.signatures[role].image;
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width * ratio));
    canvas.height = Math.max(1, Math.round(rect.height * ratio));
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#16283b';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,rect.width,rect.height);
    if(saved){
      const img = new Image();
      img.onload = ()=>ctx.drawImage(img,0,0,rect.width,rect.height);
      img.src = saved;
    }
  }

  function point(e){
    const r = canvas.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }
  function start(e){ e.preventDefault(); drawing=true; last=point(e); canvas.setPointerCapture?.(e.pointerId); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p=point(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    const now = Date.now();
    if(now - lastSignatureSave > 250){
      state.signatures[role].image = canvas.toDataURL('image/png');
      saveState();
      lastSignatureSave = now;
    }
  }
  function end(e){
    if(!drawing) return;
    drawing=false; last=null;
    state.signatures[role].image = canvas.toDataURL('image/png');
    saveState();
  }
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',move);
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
}

function setupSignatures(){
  ensureSignatureState();
  ['consultant','contractor'].forEach(role=>{
    const name=document.getElementById(role+'Name');
    const date=document.getElementById(role+'Date');
    name.value=state.signatures[role].name||'';
    date.value=state.signatures[role].date||'';
    name.addEventListener('input',()=>{state.signatures[role].name=name.value;saveState();});
    date.addEventListener('input',()=>{state.signatures[role].date=date.value;saveState();});
    setupSignaturePad(role);
  });
  document.querySelectorAll('[data-clear-signature]').forEach(btn=>btn.addEventListener('click',()=>{
    const role=btn.dataset.clearSignature;
    state.signatures[role].image='';
    saveState();
    const canvas=document.getElementById(role+'Signature');
    const ctx=canvas.getContext('2d');
    const rect=canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,rect.width,rect.height);
  }));
}

}

function hasSavedDocument(){
  try{return !!localStorage.getItem(STORAGE_KEY);}catch(e){return false;}
}

function chooseStartup(){
  return new Promise(resolve=>{
    const previousBtn=document.getElementById('previousDocumentBtn');
    previousBtn.disabled=!hasSavedDocument();
    document.getElementById('newDocumentBtn').onclick=()=>{freshState(); saveState(); document.getElementById('startupModal').classList.remove('show'); resolve();};
    previousBtn.onclick=()=>{if(!loadState()) freshState(); document.getElementById('startupModal').classList.remove('show'); resolve();};
  });
}

async function init(){
  await chooseStartup();
  renderJobInfo();
  renderTable();
  setupSignatures();

  document.getElementById('walkNum').addEventListener('input', e=>{
    state.walkNum = e.target.value.replace(/[^0-9]/g,'');
    e.target.value = state.walkNum;
    saveState();
  });

  document.getElementById('addRowBtn').addEventListener('click', addRow);
  document.getElementById('addColBtn').addEventListener('click', openColModal);
  document.getElementById('exportBtn').addEventListener('click', shareFiles);

  document.getElementById('colCancel').addEventListener('click', closeColModal);
  document.getElementById('typeButtons').addEventListener('click', e=>{
    if(e.target.tagName === 'BUTTON'){
      pendingType = e.target.dataset.type;
      document.querySelectorAll('#typeButtons button').forEach(b=>b.classList.toggle('active', b===e.target));
    }
  });
  document.getElementById('colConfirm').addEventListener('click', ()=>{
    const name = document.getElementById('newColName').value.trim();
    addColumn(name, pendingType);
    closeColModal();
    showToast('Column added.');
  });
  document.getElementById('colModal').addEventListener('click', e=>{
    if(e.target.id === 'colModal') closeColModal();
  });
}

// Emergency persistence for iOS: save whenever Safari backgrounds, the tab closes,
// or the page becomes hidden because the iPad locks, overheats, or loses power.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') saveState();
});
window.addEventListener('pagehide', saveState);
window.addEventListener('beforeunload', saveState);

init();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
